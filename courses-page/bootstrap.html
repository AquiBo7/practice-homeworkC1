<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程展示 - Bootstrap版</title>
  <!-- 引入 Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自定义样式放后面，方便后续覆盖 -->
  <link rel="stylesheet" href="css/courses.css">
</head>
<body>
  <div class="container">
    <!-- 导航栏组件 -->
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">前端课程墙</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="#">全部课程</a>
          <a class="nav-link" href="#">关于</a>
        </div>
      </div>
    </nav>

    <!-- 栅格卡片墙 -->
    <main>
      <h2 class="mb-3">全部课程</h2>
      <div class="row g-3">
        <!-- 卡片 1 -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">HTML入门</h5>
              <p class="card-text">结构与语义，页面一切的起点。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>

        <!-- 卡片 2 -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">CSS布局</h5>
              <p class="card-text">Flex、Grid与响应式设计。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>

        <!-- 卡片 3 -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">JavaScript基础</h5>
              <p class="card-text">让页面动起来的第一门语言。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-4 py-3 text-center border-top">
      <p class="text-muted mb-0">课程演示案例 · Bootstrap版</p>
    </footer>
  </div>

  <!-- 引入 Bootstrap JS 依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
